apiVersion: v1
kind: Service
metadata:
  name: sentinel-frontend
  labels:
    app.kubernetes.io/name: nexvia-sentinel
    app.kubernetes.io/component: frontend
spec:
  # NodePort provides direct access inside Minikube via `minikube service sentinel-frontend`
  type: NodePort
  selector:
    app: sentinel-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
