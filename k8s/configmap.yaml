apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  labels:
    app.kubernetes.io/name: nexvia-sentinel
    app.kubernetes.io/part-of: sentinel-platform
data:
  ENVIRONMENT: "production"
  PORT: "8000"
  LEDGER_DB_PATH: "/data/sentinel_ledger.db"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:80"
  KAFKA_ENABLED: "false"
  KAFKA_BOOTSTRAP_SERVERS: "sentinel-kafka:9092"
  DEFAULT_WEIGHT_XGB: "0.78"
  DEFAULT_WEIGHT_GNN: "0.22"
  THRESHOLD_CRITICAL: "0.80"
  THRESHOLD_HIGH: "0.65"
  THRESHOLD_MEDIUM: "0.20"
  THRESHOLD_LOW: "0.00"
